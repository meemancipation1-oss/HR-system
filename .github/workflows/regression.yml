name: Offline Regression

on:
  push:
  pull_request:

jobs:
  routing-and-baseline:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.10'
      - run: pip install -r requirements.txt
      - run: python tests/test_routing.py
      - run: python tests/test_session_store.py
      - run: python scripts/regression_gate.py
